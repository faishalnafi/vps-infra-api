## ==============================================================
## 1. PANDUAN MENGATUR IZIN DOMAIN (REFERER / KEAMANAN)
## ==============================================================
## Di sinilah Anda mengatur website apa saja yang diizinkan memuat gambar Anda.
## Gunakan spasi untuk memisahkan setiap domain. Aturannya:
## - Wildcard (*.faishalnafi.com) : Mengizinkan SEMUA subdomain dari domain tersebut.
## - Spesifik (app.faishalnafi.com) : HANYA mengizinkan URL yang persis sama.
## - Root (faishalnafi.com) : Mengizinkan akses dari domain utama tanpa awalan apapun.
##
## Contoh penulisan yang menggabungkan ketiganya:
## valid_referers server_names *.faishalnafi.com faishalnafi.com mitra.faishalnafi.co.id *.mitra.co.id;

## --- HAPUS TANDA PAGAR (#) PADA 5 BARIS DI BAWAH INI UNTUK MENGAKTIFKAN PENGAMAN ---
valid_referers server_names *.faishalnafi.com faishalnafi.com;
if ($invalid_referer) {
    return 403;
}
location = / {
    return 301 https://support.faishalnafi.com/;
}


## ==============================================================
## 2. PANDUAN MENGGANTI NAMA URL (SUBDOMAIN HEWAN)
## ==============================================================
## Jika Anda ingin mengganti /orca/ menjadi /barracuda/, Anda WAJIB mengubah DUA bagian:
## 1. Pada baris location:   location /barracuda/ {
## 2. Pada baris rewrite:    rewrite ^/barracuda/(.*) $path_a1$1 break;


## ==============================================================
## 3. PATH-BASED ROUTING (MODULAR UPSTREAM)
## ==============================================================
resolver 1.1.1.1 8.8.8.8 valid=300s;

## --------------------------------------------------------------
## A1. CLOUDFLARE R2 (Path Default: /orca/)
## --------------------------------------------------------------
location /orca/ {
    ## [OPSI 1] Custom Domain (Default Aktif)
    set $upstream_a1 "https://<CUSTOM_DOMAIN_R2>.faishalnafi.com";
    set $path_a1 "/";
    proxy_set_header Host <CUSTOM_DOMAIN_R2>.faishalnafi.com;

    ## [OPSI 2] Bawaan Provider (Hapus # pada 3 baris ini, lalu beri # pada Opsi 1)
    # set $upstream_a1 "https://<ACCOUNT_ID>.r2.cloudflarestorage.com";
    # set $path_a1 "/<NAMA_BUCKET_R2>/";
    # proxy_set_header Host <ACCOUNT_ID>.r2.cloudflarestorage.com;

    ## Logika Eksekusi (Jangan Diubah)
    rewrite ^/orca/(.*) $path_a1$1 break;
    proxy_pass $upstream_a1;
    proxy_ssl_server_name on;

    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header x-amz-request-id;
    add_header 'Access-Control-Allow-Origin' '*' always;
}

## --------------------------------------------------------------
## B1. GOOGLE CLOUD STORAGE (Path Default: /marlin/)
## --------------------------------------------------------------
location /marlin/ {
    ## [OPSI 1] Custom Domain (Default Aktif)
    # set $upstream_b1 "https://<CUSTOM_DOMAIN_GCS>.faishalnafi.com";
    # set $path_b1 "/";
    # proxy_set_header Host <CUSTOM_DOMAIN_GCS>.faishalnafi.com;

    ## [OPSI 2] Bawaan Provider
    set $upstream_b1 "https://storage.googleapis.com";
    set $path_b1 "/<NAMA_BUCKET_GCS>/";
    proxy_set_header Host storage.googleapis.com;

    ## Logika Eksekusi (Jangan Diubah)
    rewrite ^/marlin/(.*) $path_b1$1 break;
    proxy_pass $upstream_b1;
    proxy_ssl_server_name on;

    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header x-guploader-uploadid;
    add_header 'Access-Control-Allow-Origin' '*' always;
}

## --------------------------------------------------------------
## C1. AWS S3 (Path Default: /kraken/)
## --------------------------------------------------------------
location /kraken/ {
    ## [OPSI 1] Custom Domain (Default Aktif)
    set $upstream_c1 "https://<CUSTOM_DOMAIN_S3>.faishalnafi.com";
    set $path_c1 "/";
    proxy_set_header Host <CUSTOM_DOMAIN_S3>.faishalnafi.com;

    ## [OPSI 2] Bawaan Provider
    # set $upstream_c1 "https://<NAMA_BUCKET_AWS>.s3.<REGION>.amazonaws.com";
    # set $path_c1 "/";
    # proxy_set_header Host <NAMA_BUCKET_AWS>.s3.<REGION>.amazonaws.com;

    ## Logika Eksekusi (Jangan Diubah)
    rewrite ^/kraken/(.*) $path_c1$1 break;
    proxy_pass $upstream_c1;
    proxy_ssl_server_name on;

    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header x-amz-id-2;
    add_header 'Access-Control-Allow-Origin' '*' always;
}

## --------------------------------------------------------------
## D1. IDCLOUDHOST S3 (Path Default: /leviathan/)
## --------------------------------------------------------------
location /leviathan/ {
    ## [OPSI 1] Custom Domain (Default Aktif)
    # set $upstream_d1 "https://<CUSTOM_DOMAIN_IDCLOUDHOST>.faishalnafi.com";
    # set $path_d1 "/";
    # proxy_set_header Host <CUSTOM_DOMAIN_IDCLOUDHOST>.faishalnafi.com;

    ## [OPSI 2] Bawaan Provider
    set $upstream_d1 "https://is3.cloudhost.id";
    set $path_d1 "/<NAMA_BUCKET_IDCLOUDHOST>/";
    proxy_set_header Host is3.cloudhost.id;

    ## Logika Eksekusi (Jangan Diubah)
    rewrite ^/leviathan/(.*) $path_d1$1 break;
    proxy_pass $upstream_d1;
    proxy_ssl_server_name on;

    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header x-amz-request-id;
    add_header 'Access-Control-Allow-Origin' '*' always;
}

